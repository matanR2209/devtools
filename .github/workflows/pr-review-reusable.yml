name: PR Review (Reusable)

on:
  workflow_call:
    inputs:
      typescript_blocking:
        description: "Fail the workflow if TypeScript errors are found"
        type: boolean
        default: true
      eslint_blocking:
        description: "Fail the workflow if unfixable ESLint errors remain"
        type: boolean
        default: true
      claude_blocking:
        description: "Fail the workflow if Claude finds blocking issues"
        type: boolean
        default: false
      node_version:
        description: "Node.js version to use"
        type: string
        default: "20"
      working_directory:
        description: "Directory to run checks in (relative to repo root)"
        type: string
        default: "."
      package_manager:
        description: "Package manager of the target repo: npm or pnpm (pnpm version read from the packageManager field in package.json)"
        type: string
        default: "npm"
      run_tests:
        description: "Also run the repo's test suite (npm test / pnpm test) against a Postgres 16 service"
        type: boolean
        default: false
      test_database_url:
        description: "Exported as DATABASE_URL and TEST_DATABASE_URL to the test run; the Postgres service listens on localhost:5432 with user/password postgres"
        type: string
        default: "postgres://postgres:postgres@localhost:5432/postgres"
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  # ────────────────────────────────────────────────
  # Job 1 – TypeScript
  # ────────────────────────────────────────────────
  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}
          cache-dependency-path: ${{ inputs.working_directory }}/${{ inputs.package_manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.package_manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      - name: Run TypeScript check
        id: tsc
        working-directory: ${{ inputs.working_directory }}
        run: npx tsc --noEmit
        continue-on-error: ${{ !inputs.typescript_blocking }}

      - name: Fail if TypeScript errors and blocking
        if: steps.tsc.outcome == 'failure' && inputs.typescript_blocking
        run: |
          echo "::error::TypeScript check failed. Fix type errors before merging."
          exit 1

      - name: Advisory notice
        if: steps.tsc.outcome == 'failure' && !inputs.typescript_blocking
        run: echo "::warning::TypeScript check failed (advisory only — not blocking)."

  # ────────────────────────────────────────────────
  # Job 2 – ESLint (auto-fix + commit + gate)
  # ────────────────────────────────────────────────
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # Use the head ref so we can push fixes back to the PR branch
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout devtools (scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/devtools
          ref: main
          path: .devtools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}
          cache-dependency-path: ${{ inputs.working_directory }}/${{ inputs.package_manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install PR branch dependencies
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.package_manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      - name: Install devtools script dependencies
        working-directory: .devtools
        run: npm install

      - name: Run ESLint with auto-fix
        working-directory: ${{ inputs.working_directory }}
        run: |
          npx eslint --fix --format json --output-file eslint-report.json . || true
          # Always exits 0 here; we inspect the report ourselves

      - name: Check for fixes to commit
        id: check_fixes
        working-directory: ${{ inputs.working_directory }}
        run: |
          if git diff --quiet; then
            echo "has_fixes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_fixes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit auto-fixed files
        if: steps.check_fixes.outputs.has_fixes == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(lint): auto-fix ESLint issues [skip ci]"
          git push

      - name: Post ESLint annotations
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: ${{ inputs.working_directory }}
        run: node $GITHUB_WORKSPACE/.devtools/scripts/post-eslint-annotations.js

      - name: Gate on unfixable errors
        id: eslint_gate
        working-directory: ${{ inputs.working_directory }}
        run: |
          # Count remaining errors after the fix pass
          ERROR_COUNT=$(node -e "
            const fs = require('fs');
            if (!fs.existsSync('eslint-report.json')) { process.stdout.write('0'); process.exit(0); }
            const report = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
            const errors = report.reduce((acc, f) => acc + f.errorCount, 0);
            process.stdout.write(String(errors));
          ")
          echo "error_count=${ERROR_COUNT}" >> "$GITHUB_OUTPUT"
          echo "ESLint errors remaining: ${ERROR_COUNT}"

      - name: Fail if ESLint errors remain and blocking
        if: steps.eslint_gate.outputs.error_count != '0' && inputs.eslint_blocking
        run: |
          echo "::error::ESLint found ${{ steps.eslint_gate.outputs.error_count }} unfixable error(s). Fix them before merging."
          exit 1

      - name: Advisory notice
        if: steps.eslint_gate.outputs.error_count != '0' && !inputs.eslint_blocking
        run: echo "::warning::ESLint found ${{ steps.eslint_gate.outputs.error_count }} unfixable error(s) (advisory only)."

  # ────────────────────────────────────────────────
  # Job 3 – Claude AI Code Review
  # ────────────────────────────────────────────────
  claude-review:
    name: Claude AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout devtools (scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/devtools
          ref: main
          path: .devtools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install devtools script dependencies
        working-directory: .devtools
        run: npm install

      - name: Run Claude review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BLOCKING: ${{ inputs.claude_blocking }}
        run: node .devtools/scripts/claude-review.js

  # ────────────────────────────────────────────────
  # Job 4 – PR Description Generator (non-blocking)
  # ────────────────────────────────────────────────
  pr-description:
    name: Generate PR Description
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout devtools (scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/devtools
          ref: main
          path: .devtools
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install devtools script dependencies
        working-directory: .devtools
        run: npm install

      - name: Generate PR description
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .devtools/scripts/generate-pr-description.js
        # Always exit 0 — description generation never blocks a PR
        continue-on-error: true

      - name: Warn if generation failed
        if: steps.generate.outcome == 'failure'
        run: echo "::warning::PR description generation step failed — see the 'Generate PR description' step log for details. The PR body may not have been updated."

      - name: Verify PR body was written
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .body)
          if echo "$BODY" | grep -qF '<Claude to complete>'; then
            echo "::error::PR description generation failed — the PR body still contains the '<Claude to complete>' placeholder. Fill it in manually before relying on it."
          fi
          exit 0

  # ────────────────────────────────────────────────
  # Job 5 – Tests (opt-in, with a Postgres 16 service)
  # ────────────────────────────────────────────────
  tests:
    name: Tests
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}
          cache-dependency-path: ${{ inputs.working_directory }}/${{ inputs.package_manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.package_manager == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      - name: Run tests
        working-directory: ${{ inputs.working_directory }}
        env:
          DATABASE_URL: ${{ inputs.test_database_url }}
          TEST_DATABASE_URL: ${{ inputs.test_database_url }}
          CI: "true"
        run: ${{ inputs.package_manager == 'pnpm' && 'pnpm test' || 'npm test' }}
